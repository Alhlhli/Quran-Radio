<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- أنماط الظلال والتوهج -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <filter id="innerGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in2="SourceAlpha" operator="arithmetic" k2="-1" k3="1" result="shadowDiff"/>
      <feFlood flood-color="#dfb76c" flood-opacity="0.3"/>
      <feComposite in2="shadowDiff" operator="in"/>
      <feComposite in2="SourceGraphic" operator="over"/>
    </filter>

    <!-- تدرجات الخلفية -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#184163"/>
      <stop offset="60%" stop-color="#0a1d30"/>
      <stop offset="100%" stop-color="#040b13"/>
    </radialGradient>

    <!-- تدرجات الذهب الفاخر -->
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE0AD"/>
      <stop offset="35%" stop-color="#DFB267"/>
      <stop offset="70%" stop-color="#B88728"/>
      <stop offset="100%" stop-color="#E8C887"/>
    </linearGradient>

    <linearGradient id="goldLight" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#D4A349"/>
      <stop offset="100%" stop-color="#FFF2D4"/>
    </linearGradient>

    <linearGradient id="goldDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#996D19"/>
      <stop offset="100%" stop-color="#5E4007"/>
    </linearGradient>

    <linearGradient id="pageGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EFE3C3"/>
      <stop offset="50%" stop-color="#FFFDF7"/>
      <stop offset="100%" stop-color="#E2D4AF"/>
    </linearGradient>

    <!-- الزخرفة الإسلامية في الخلفية -->
    <pattern id="islamicPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M20 0 L40 20 L20 40 L0 20 Z" fill="none" stroke="#e8c887" stroke-width="0.8" stroke-opacity="0.08"/>
      <circle cx="20" cy="20" r="10" fill="none" stroke="#e8c887" stroke-width="0.8" stroke-opacity="0.08"/>
      <path d="M0 0 L40 40 M40 0 L0 40" stroke="#e8c887" stroke-width="0.5" stroke-opacity="0.05"/>
    </pattern>
  </defs>

  <!-- خلفية كاملة الحواف (maskable: لا زوايا شفافة) -->
  <rect width="512" height="512" fill="url(#bgGrad)"/>
  <rect width="512" height="512" fill="url(#islamicPattern)"/>

  <!-- المحتوى مُصغّر داخل منطقة الأمان (80%) -->
  <g transform="translate(256 256) scale(0.78) translate(-256 -256)">
    <!-- القوس المحرابي في الأعلى -->
    <path d="M50 210 C50 110, 160 50, 256 35 C352 50, 462 110, 462 210" fill="none" stroke="url(#gold)" stroke-width="4" stroke-linecap="round" opacity="0.85"/>
    <path d="M70 205 C70 125, 170 70, 256 55 C342 70, 442 125, 442 205" fill="none" stroke="url(#gold)" stroke-width="1.5" opacity="0.4"/>

    <!-- زخرفة قمة المحراب -->
    <circle cx="256" cy="35" r="5" fill="url(#gold)"/>

    <!-- مجموع عناصر الأيقونة المركزية -->
    <g filter="url(#shadow)">
      <!-- قوس السماعة العلوية -->
      <path d="M165 220 A 105 105 0 0 1 347 220" fill="none" stroke="url(#gold)" stroke-width="14" stroke-linecap="round"/>
      <path d="M175 220 A 95 95 0 0 1 337 220" fill="none" stroke="url(#goldLight)" stroke-width="3" opacity="0.7"/>

      <!-- وسائد السماعات (يسار ويمين) -->
      <g>
        <!-- يسار -->
        <rect x="135" y="195" width="28" height="65" rx="14" fill="url(#gold)" stroke="#5E4007" stroke-width="2"/>
        <rect x="142" y="202" width="14" height="51" rx="7" fill="url(#goldLight)"/>
        <path d="M158 190 L168 205" stroke="url(#gold)" stroke-width="6" stroke-linecap="round"/>
        <!-- يمين -->
        <rect x="349" y="195" width="28" height="65" rx="14" fill="url(#gold)" stroke="#5E4007" stroke-width="2"/>
        <rect x="356" y="202" width="14" height="51" rx="7" fill="url(#goldLight)"/>
        <path d="M354 190 L344 205" stroke="url(#gold)" stroke-width="6" stroke-linecap="round"/>
      </g>

      <!-- برج البث وأمواج الراديو -->
      <g>
        <!-- البرج الصغير في المنتصف -->
        <path d="M256 128 L256 168" stroke="url(#goldLight)" stroke-width="5" stroke-linecap="round"/>
        <polygon points="252,168 260,168 263,185 249,185" fill="url(#gold)"/>
        <circle cx="256" cy="125" r="7" fill="url(#goldLight)"/>
        <!-- أمواج الراديو -->
        <path d="M242 115 A 18 18 0 0 0 242 135" fill="none" stroke="url(#goldLight)" stroke-width="3.5" stroke-linecap="round"/>
        <path d="M270 115 A 18 18 0 0 1 270 135" fill="none" stroke="url(#goldLight)" stroke-width="3.5" stroke-linecap="round"/>
        <path d="M233 105 A 32 32 0 0 0 233 145" fill="none" stroke="url(#goldLight)" stroke-width="3.5" stroke-linecap="round"/>
        <path d="M279 105 A 32 32 0 0 1 279 145" fill="none" stroke="url(#goldLight)" stroke-width="3.5" stroke-linecap="round"/>
      </g>

      <!-- حامل المصحف (الرحل الخشبي المزخرف) -->
      <g>
        <!-- الساق اليسرى الأمامية -->
        <path d="M256 265 L175 320 C160 330, 170 345, 185 340 L220 328 L256 295" fill="url(#goldDark)" stroke="url(#gold)" stroke-width="2.5"/>
        <!-- الساق اليمنى الأمامية -->
        <path d="M256 265 L337 320 C352 330, 342 345, 327 340 L292 328 L256 295" fill="url(#goldDark)" stroke="url(#gold)" stroke-width="2.5"/>
        <!-- الأرجل السفلية المتقاطعة -->
        <path d="M225 305 L170 345 C155 356, 168 368, 185 362 L245 320" fill="url(#gold)" stroke="#5E4007" stroke-width="2"/>
        <path d="M287 305 L342 345 C357 356, 344 368, 327 362 L267 320" fill="url(#gold)" stroke="#5E4007" stroke-width="2"/>
        <!-- حفر وزخرفة الحامل -->
        <circle cx="205" cy="336" r="3.5" fill="#2d1d02"/>
        <circle cx="307" cy="336" r="3.5" fill="#2d1d02"/>
      </g>

      <!-- غلاف المصحف الخارجي -->
      <path d="M148 240 L256 292 L364 240 L364 248 L256 300 L148 248 Z" fill="url(#goldDark)" stroke="url(#gold)" stroke-width="1.5"/>

      <!-- صفحات المصحف المفتوح -->
      <!-- الصفحة اليسرى -->
      <path d="M256 288 C215 268, 180 258, 155 242 L185 178 C210 196, 240 205, 256 220 Z" fill="url(#pageGrad)" stroke="url(#gold)" stroke-width="2"/>
      <!-- الصفحة اليمنى -->
      <path d="M256 288 C297 268, 332 258, 357 242 L327 178 C302 196, 272 205, 256 220 Z" fill="url(#pageGrad)" stroke="url(#gold)" stroke-width="2"/>

      <!-- إطار التذهيب الداخلي لصفحات المصحف -->
      <path d="M252 280 C218 262, 190 254, 168 240 L192 188 C213 204, 238 212, 252 225 Z" fill="none" stroke="url(#gold)" stroke-width="1.2"/>
      <path d="M260 280 C294 262, 322 254, 344 240 L320 188 C299 204, 274 212, 260 225 Z" fill="none" stroke="url(#gold)" stroke-width="1.2"/>

      <!-- خطوط محاكاة الآيات الكريمة -->
      <g stroke="#9c7739" stroke-width="1.2" stroke-linecap="round" opacity="0.75">
        <!-- سطور الصفحة اليسرى -->
        <line x1="195" y1="202" x2="242" y2="228"/>
        <line x1="190" y1="212" x2="243" y2="240"/>
        <line x1="183" y1="223" x2="245" y2="252"/>
        <line x1="176" y1="233" x2="246" y2="265"/>

        <!-- سطور الصفحة اليمنى -->
        <line x1="270" y1="228" x2="317" y2="202"/>
        <line x1="269" y1="240" x2="322" y2="212"/>
        <line x1="267" y1="252" x2="329" y2="223"/>
        <line x1="266" y1="265" x2="336" y2="233"/>
      </g>

      <!-- شريط القراءة (الفاصل) الممتد للأسفل -->
      <path d="M256 288 Q252 320 256 345" fill="none" stroke="#257A58" stroke-width="3.5" stroke-linecap="round"/>
      <circle cx="256" cy="346" r="3" fill="url(#gold)"/>
    </g>

    <!-- النصوص السفلية المنسقة -->
    <g text-anchor="middle" id="texts" filter="url(#shadow)">
      <!-- النص العربي -->
      <text x="256" y="420" fill="url(#goldLight)" font-family="'Amiri', 'Traditional Arabic', 'Scheherazade', serif" font-size="37" font-weight="bold" letter-spacing="1">
        رَادِيْو القُرْآن الكَرِيم
      </text>

      <!-- النص الإنجليزي -->
      <text x="256" y="452" fill="url(#gold)" font-family="'Montserrat', 'Segoe UI', 'Arial', sans-serif" font-size="16" font-weight="700" letter-spacing="4">
        HOLY QURAN RADIO
      </text>
    </g>
  </g>
</svg>
