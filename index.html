<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>راديو القرآن الكريم</title>
<meta name="description" content="استمع لأكثر من 150 إذاعة وقارئ للقرآن الكريم — بث مباشر من المتصفح بدون تثبيت"/>
<meta name="theme-color" content="#0b1f1c"/>
<link rel="manifest" href="manifest.json"/>
<link rel="icon" href="icon.svg" type="image/svg+xml"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="راديو القرآن"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Amiri:wght@400;700&family=Noto+Naskh+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css"/>
</head>
<body>

  <!-- ═══ HEADER ═══ -->
  <header class="app-header">
    <div class="hero-banner">
       <svg class="mosque-svg" viewBox="0 0 600 200" preserveAspectRatio="xMidYMax meet" fill="var(--gd2)">
        <path
          d="M0,200 L0,140 L40,140 L40,120 L60,120 L60,140 L80,140 L80,110 Q100,60 120,110 L120,140 L140,140 L140,120 L155,100 L155,80 Q160,40 165,80 L165,100 L180,120 L180,140 L200,140 L200,80 Q210,20 220,0 Q230,20 240,80 L240,140 L260,140 L260,120 L275,100 L275,80 Q280,40 285,80 L285,100 L300,120 L300,140 L320,140 L320,110 Q340,60 360,110 L360,140 L380,140 L380,120 L400,120 L400,140 L420,140 L420,110 Q440,60 460,110 L460,140 L480,140 L480,120 L500,120 L500,140 L520,140 L520,110 Q540,60 560,110 L560,140 L600,140 L600,200 Z" />
        <circle cx="220" cy="0" r="12" />
        <line x1="220" y1="-15" x2="220" y2="10" stroke="var(--gd2)" stroke-width="2" />
      </svg>

      <div class="hero-top">
        <div class="logo-area">
          <div class="logo-gem">
            <svg viewBox="0 0 24 24">
              <path
                d="M21 5c-1.11-.35-2.33-.5-3.5-.5-1.95 0-4.05.4-5.5 1.5-1.45-1.1-3.55-1.5-5.5-1.5S2.45 4.9 1 6v14.65c0 .25.25.5.5.5.1 0 .15-.05.25-.05C3.1 20.45 5.05 20 6.5 20c1.95 0 4.05.4 5.5 1.5 1.35-.85 3.8-1.5 5.5-1.5 1.65 0 3.35.3 4.75 1.05.1.05.15.05.25.05.25 0 .5-.25.5-.5V6c-.6-.45-1.25-.75-2-1zm0 13.5c-1.1-.35-2.3-.5-3.5-.5-1.7 0-4.15.65-5.5 1.5V8c1.35-.85 3.8-1.5 5.5-1.5 1.2 0 2.4.15 3.5.5v11.5z" />
            </svg>
          </div>
          <div class="brand-col">
            <h1 class="brand-title">راديو القرآن الكريم</h1>
            <div class="brand-sub">HOLY QURAN RADIO</div>
            <div class="brand-ayah">﴿ وَرَتِّلِ الْقُرْآنَ تَرْتِيلًا ﴾</div>
          </div>
        </div>

        <div class="hero-search">
          <div class="search-wrap">
            <input type="text" id="searchInput" class="search-input" placeholder="ابحث عن قارئ أو إذاعة..." autocomplete="off">
            <svg class="search-icon" viewBox="0 0 24 24" width="19" height="19"><path fill="currentColor" d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
            <button class="search-clear-btn" id="searchClearBtn" title="مسح البحث" style="display:none">
              <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
            </button>
          </div>
        </div>

      <div class="actions-area">
        <button class="icon-btn" id="themeBtn" title="تبديل الوضع">
          <svg viewBox="0 0 24 24"><path d="M20 8.69V4h-4.69L12 .69 8.69 4H4v4.69L.69 12 4 15.31V20h4.69L12 23.31 15.31 20H20v-4.69L23.31 12 20 8.69zM12 18c-3.31 0-6-2.69-6-6s2.69-6 6-6 6 2.69 6 6-2.69 6-6 6z"/></svg>
        </button>
        <button class="icon-btn" id="langBtn" title="Language">
          <svg viewBox="0 0 24 24"><path d="M12.87 15.07l-2.54-2.51.03-.03c1.74-1.94 2.98-4.17 3.71-6.53H17V4h-7V2H8v2H1v1.99h11.17C11.5 7.92 10.44 9.75 9 11.35 8.07 10.32 7.3 9.19 6.69 8h-2c.73 1.63 1.73 3.17 2.98 4.56l-5.09 5.02L4 19l5-5 3.11 3.11.76-2.04z"/></svg>
        </button>
        <button class="icon-btn" id="favBtn" title="المفضلة">
          <svg viewBox="0 0 24 24"><path d="M16.5 3c-1.74 0-3.41.81-4.5 2.09C10.91 3.81 9.24 3 7.5 3 4.42 3 2 5.42 2 8.5c0 3.78 3.4 6.86 8.55 11.54L12 21.35l1.45-1.32C18.6 15.36 22 12.28 22 8.5 22 5.42 19.58 3 16.5 3z"/></svg>
        </button>
        <button class="icon-btn" id="focusBtn" title="وضع التركيز">
          <svg viewBox="0 0 24 24"><path d="M17 8C8 10 5.9 16.17 3.82 21c.01 0 .02.01.03.02L6 19c1.79-2.79 4.12-5 8-6C17.63 12.13 20 9.76 20 7c0-1.5-.74-2.79-1.86-3.58L17 5v3z"/></svg>
        </button>
        <button class="icon-btn" id="scheduleBtn" title="جدولة التشغيل">
          <svg viewBox="0 0 24 24"><path d="M17 12h-5v5h5v-5zM16 1v2H8V1H6v2H5c-1.11 0-1.99.9-1.99 2L3 19c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2h-1V1h-2zm3 18H5V8h14v11z"/></svg>
        </button>
        <button class="icon-btn" id="bigBtn" title="وضع كبير">
          <svg viewBox="0 0 24 24"><path d="M15 3l2.3 2.3-2.89 2.87 1.42 1.42L18.7 6.7 21 9V3h-6zM3 9l2.3-2.3 2.87 2.89 1.42-1.42L6.7 5.3 9 3H3v6zm6 12l-2.3-2.3 2.89-2.87-1.42-1.42L5.3 17.3 3 15v6h6zm12-6l-2.3 2.3-2.87-2.89-1.42 1.42 2.89 2.87L15 21h6v-6z"/></svg>
        </button>
      </div>
    </div>

    <div class="hero-tags">
      <div class="tags-scroll" id="tagsContainer"></div>
    </div>
  </div><!-- /hero-banner -->
</header>

<!-- Ayah of the day -->
<div class="ayah-banner" id="ayahBanner">
  <div class="ayah-deco">✦ آية اليوم ✦</div>
  <div class="ayah-text" id="ayahText"></div>
  <div class="ayah-ref" id="ayahRef"></div>
</div>

<!-- Smart suggestions + recently played -->
<div class="quick-favs" id="smartRow" style="display:none">
  <div class="quick-inner" id="smartInner"></div>
</div>

<!-- Quick Favs -->
<div id="quickFavsWrap" style="display:none">
  <div class="quick-favs"><div class="quick-inner" id="quickFavsInner"></div></div>
</div>

<!-- Stats -->
<div class="stats-row" id="statsRow"></div>

<!-- Grid -->
<div class="content-grid" id="radioGrid"></div>

<!-- ═══ PLAYER ═══ -->
<div class="player-wrap">
  <div class="player-bar" id="playerBar">
    <!-- Gold line via ::before -->

    <!-- Waveform -->
    <div class="wave-bar-row" id="waveRow">
      <div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div>
      <div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div>
      <div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div>
      <div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div>
      <div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div>
    </div>

    <!-- Info -->
    <div class="player-info-row">
      <div class="vinyl" id="vinyl" onclick="openNowPlayingModal()">
        <div class="vinyl-center">
          <svg viewBox="0 0 24 24"><path d="M12 3v9.28c-.47-.17-.97-.28-1.5-.28C8.01 12 6 14.01 6 16.5S8.01 21 10.5 21c2.31 0 4.2-1.75 4.45-4H15V6h4V3h-7z"/></svg>
        </div>
      </div>
      <div class="p-text">
        <div class="p-title" id="pTitle">اختر إذاعة للبدء</div>
        <div class="p-status stopped" id="pStatus">
          <span class="live-dot"></span>
          <span class="sleep-badge" id="sleepBadge"></span>
          <span id="pStatusTxt">جاهز</span>
        </div>
      </div>
    </div>

    <!-- Controls -->
    <div class="player-controls">
      <!-- LEFT -->
      <div class="ctrl-left">
	      <button class="p-btn" id="playerFavBtn" title="إضافة للمفضلة">
            <svg viewBox="0 0 24 24">
              <path
                d="M16.5 3c-1.74 0-3.41.81-4.5 2.09C10.91 3.81 9.24 3 7.5 3 4.42 3 2 5.42 2 8.5c0 3.78 3.4 6.86 8.55 11.54L12 21.35l1.45-1.32C18.6 15.36 22 12.28 22 8.5 22 5.42 19.58 3 16.5 3z" />
            </svg>
          </button>
        <button class="p-btn" id="shuffleBtn" title="عشوائي">
          <svg viewBox="0 0 24 24"><path d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/></svg>
        </button>
        <button class="p-btn" id="reportBtn" title="إبلاغ عن محطة غير شغّالة">
          <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>
        </button>
        <button class="p-btn player-close-btn" id="closePlayerBtn" title="إغلاق المشغل">
          <svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
        </button>
      </div>

      <!-- CENTER -->
      <div class="ctrl-center">
        <button class="nav-btn" id="prevBtn" title="السابق">
          <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
        </button>
        <button class="play-btn" id="playBtn">
          <svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z" fill="currentColor"/></svg>
        </button>
        <button class="nav-btn" id="nextBtn" title="التالي">
          <svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
        </button>
      </div>

      <!-- RIGHT -->
      <div class="ctrl-right">
        <button class="p-btn" id="sleepBtn" title="مؤقت النوم">
          <svg viewBox="0 0 24 24"><path d="M17.75 4.09l-2.53 1.94.91 3.06-2.63-1.81-2.63 1.81.91-3.06-2.53-1.94 3.17-.09L12 1l1.38 3.01 3.37-.09zM12 4a8 8 0 0 0-8 8 8 8 0 0 0 8 8 8 8 0 0 0 8-8 8 8 0 0 0-8-8zm1 13h-2v-2h2v2zm2.07-7.75l-.9.92C13.45 10.9 13 11.5 13 13h-2v-.5c0-1.1.45-2.1 1.17-2.83l1.24-1.26c.37-.36.59-.86.59-1.41 0-1.1-.9-2-2-2s-2 .9-2 2H8c0-2.21 1.79-4 4-4s4 1.79 4 4c0 .88-.36 1.68-.93 2.25z"/></svg>
        </button>
        <div class="vol-wrap">
          <button class="vol-btn" id="volBtn">
            <svg id="volIcon" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-.77-3.29-2-4.25v8.5c1.23-.96 2-2.48 2-4.25zM14 3.23v2.06c3.39.49 6 3.39 6 6.71s-2.61 6.22-6 6.71v2.06c4.45-.5 8-4.27 8-8.77s-3.55-8.27-8-8.77z" fill="currentColor"/></svg>
          </button>
          <input type="range" class="vol-slider" id="volSlider" min="0" max="1" step="0.01" value="1">
        </div>
        <button class="p-btn" id="shareBtn" title="مشاركة">
          <svg viewBox="0 0 24 24"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92s2.92-1.31 2.92-2.92-1.31-2.92-2.92-2.92z"/></svg>
        </button>
      </div>
    </div>

    <!-- Sleep Panel -->
    <div class="sleep-panel" id="sleepPanel">
      <div class="sleep-panel-title">⏱ مؤقت إيقاف التشغيل</div>
      <div class="sleep-opts">
        <div class="sleep-opt" data-min="5">5 دقائق</div>
        <div class="sleep-opt" data-min="10">10 دقائق</div>
        <div class="sleep-opt" data-min="15">15 دقيقة</div>
        <div class="sleep-opt" data-min="30">30 دقيقة</div>
        <div class="sleep-opt" data-min="45">45 دقيقة</div>
        <div class="sleep-opt" data-min="60">ساعة</div>
        <div class="sleep-opt" data-min="120">ساعتين</div>
        <div class="sleep-opt" data-min="180">ثلاث ساعات</div>
        <div class="sleep-opt" data-min="300">خمس ساعات</div>
        <div class="sleep-opt" data-min="0">إلغاء</div>
      </div>
    </div>
  </div>
</div>

<!-- Mini YouTube -->
<div class="mini-live" id="miniLive">
  <div class="ml-header">
    <div class="ml-title" id="mlTitle">بث مباشر</div>
    <div style="display:flex;gap:5px;pointer-events:auto">
      <button class="ml-close" id="mlFullscreen" title="ملء الشاشة" style="font-size:12px">⛶</button>
      <button class="ml-close" id="mlOpenYT" title="فتح في يوتيوب" style="font-size:10px">YT</button>
      <button class="ml-close" id="mlClose">✕</button>
    </div>
  </div>
  <div id="mlContent" style="width:100%;height:100%"></div>
  <div class="ml-resize" id="mlResize">⤢</div>
</div>

<!-- Focus Slideshow -->
<div class="focus-slideshow" id="focusSlideshow"></div>

<!-- Focus Control Panel -->
<div class="focus-ctrl-panel" id="focusCtrlPanel">
  <!-- Row 1: title + close -->
  <div class="fcp-row fcp-top">
    <span class="fcp-title">🖼 وضع التركيز</span>
    <button class="fcp-close-btn" id="focusCloseBtn" title="إغلاق وضع التركيز">
      <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
    </button>
  </div>

  <!-- Row 2: photo nav + label -->
  <div class="fcp-row">
    <button class="fcp-btn" id="slideshowPrevBtn">
      <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M15.41 16.59L10.83 12l4.58-4.59L14 6l-6 6 6 6z"/></svg>
    </button>
    <span class="fcp-photo-label" id="slideshowLabel">مكة المكرمة</span>
    <button class="fcp-btn" id="slideshowNextBtn">
      <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6z"/></svg>
    </button>
    <button class="fcp-btn fcp-toggle active" id="slideshowToggleBtn" title="إخفاء/إظهار الصور">
      <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/></svg>
    </button>
  </div>

  <!-- Row 3: opacity slider -->
  <div class="fcp-row fcp-slider-row">
    <span class="fcp-slider-label">
      <svg viewBox="0 0 24 24" width="14" height="14"><path fill="currentColor" d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9 9-4.03 9-9c0-.46-.04-.92-.1-1.36-.98 1.37-2.58 2.26-4.4 2.26-2.98 0-5.4-2.42-5.4-5.4 0-1.81.89-3.42 2.26-4.4-.44-.06-.9-.1-1.36-.1z"/></svg>
      شفافية
    </span>
    <input type="range" class="fcp-range" id="slideshowOpacity" min="10" max="90" value="55" step="5">
    <span class="fcp-val" id="opacityVal">55%</span>
  </div>

  <!-- Row 4: brightness slider -->
  <div class="fcp-row fcp-slider-row">
    <span class="fcp-slider-label">
      <svg viewBox="0 0 24 24" width="14" height="14"><path fill="currentColor" d="M20 8.69V4h-4.69L12 .69 8.69 4H4v4.69L.69 12 4 15.31V20h4.69L12 23.31 15.31 20H20v-4.69L23.31 12 20 8.69zM12 18c-3.31 0-6-2.69-6-6s2.69-6 6-6 6 2.69 6 6-2.69 6-6 6z"/></svg>
      إضاءة
    </span>
    <input type="range" class="fcp-range" id="slideshowBrightness" min="30" max="130" value="85" step="5">
    <span class="fcp-val" id="brightnessVal">85%</span>
  </div>
</div>

<button class="scroll-top" id="scrollTopBtn" title="العودة للأعلى">
  <svg viewBox="0 0 24 24"><path d="M7.41 15.41L12 10.83l4.59 4.58L18 14l-6-6-6 6z"/></svg>
</button>

<div id="toast"></div>

<!-- ═══ JAVASCRIPT ═══ -->
<script src="stations.js"></script>
<script src="app.js"></script>
</body>
</html>
